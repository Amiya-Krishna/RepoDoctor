name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Security and unit tests
        run: npm test
        env:
          # Docker is available on the runner, so the real-container isolation tests run (they are skipped, not passed, elsewhere).
          CI: "true"
      - run: npm run build

  migrations:
    name: Database migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: repodoctor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/repodoctor?schema=public
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Schema and migrations are in sync (no drift)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  client:
    name: Client (lint, build, UI tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mocked-API UI tests (privacy gate, approval gate)
        run: |
          npm run preview -- --port 8080 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:8080 --timeout 30000 || sleep 5
          npx playwright test e2e/privacy-flow.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:8080

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies, fail on high/critical)
        run: |
          for d in server client; do
            echo "== $d"; (cd $d && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high)
          done

  trivy-fs:
    name: "Trivy (filesystem: vulnerabilities, secrets, misconfiguration)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Build images and scan with Trivy
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        run: docker build -t repodoctor-server:ci server
      - name: Build client image
        run: docker build -t repodoctor-client:ci client
      - name: Trivy scan server image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: repodoctor-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan client image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: repodoctor-client:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Compose file is valid
        run: |
          REDIS_PASSWORD=ci DATABASE_URL=postgresql://u:p@h/db touch server/.env
          REDIS_PASSWORD=ci DATABASE_URL=postgresql://u:p@h/db docker compose config -q
