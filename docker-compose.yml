services:

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    volumes:
      - ./server:/app/server
      - /app/server/node_modules

    restart: unless-stopped

  analysis:
    build:
      context: .
      dockerfile: docker/analysis/Dockerfile

    working_dir: /workspace

    command: ["node", "--version"]

    restart: "no"