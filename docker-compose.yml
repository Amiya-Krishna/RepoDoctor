# RepoDoctor stack: API server, scan worker, repair worker, Redis and the
# nginx-served React client (the only published port, 8080).
#
# Database: set DATABASE_URL in the root .env to your PostgreSQL, e.g. a Neon
# connection string (see .env.example). Optionally run the bundled PostgreSQL
# instead: set POSTGRES_PASSWORD, leave DATABASE_URL unset and start with
#   docker compose --profile bundled-db up --build -d
#
# Required in the shell or a root .env file (see .env.example):
#   DATABASE_URL (or POSTGRES_PASSWORD with the bundled-db profile)
#   REDIS_PASSWORD  password for the bundled Redis
# and a filled-in server/.env (copy server/.env.example). For this stack set
#   FRONTEND_URL=http://localhost:8080
#   GITHUB_CALLBACK_URL=http://localhost:8080/api/github/callback
# (the API listens on 4000 inside the network; only the client's 8080 is published).
#
# The repair worker is deliberately NOT part of this public-facing stack. It runs
# untrusted repository tests in Docker containers, so it must run on a dedicated
# sandbox host with its own local Docker daemon (workspace bind mounts require the
# worker and the daemon to share a filesystem), connected to this stack's Redis and
# database over a private network. The host Docker socket is never mounted into any
# service here: that would give code that escapes a container root on the host.
# See docs/DEPLOYMENT.md, "Sandbox host".
x-database-url: &database-url ${DATABASE_URL:-postgresql://repodoctor:${POSTGRES_PASSWORD:-}@postgres:5432/repodoctor?schema=public}

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: *database-url
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
  # Production refuses plain-http origins. Set ALLOW_INSECURE_HTTP=true ONLY for a local evaluation on localhost.
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  stop_grace_period: 60s

services:
  postgres:
    profiles: ["bundled-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repodoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: repodoctor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repodoctor -d repodoctor"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  server:
    <<: *hardening
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      <<: *server-env
      PORT: "4000"
      TRUST_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

  scan-worker:
    <<: *hardening
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/workers/scan.worker.js"]
    env_file:
      - ./server/.env
    environment:
      <<: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  client:
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
